<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barnyard Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top: #CDEAF6;
    --sky-bottom: #F4EFE1;
    --ink: #4A3B2A;
    --accent: #E8965A;
    --accent-soft: #FBD8B6;
    --leaf: #8FAE6B;
    --card: #FFFDF7;
    --shadow: rgba(74,59,42,0.18);
    --card-w: 72px;
    --card-h: 100px;
    --stack-offset: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    user-select:none;
  }

  header{
    text-align:center;
    padding:20px 16px 4px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(24px, 5vw, 36px);
    color:var(--accent);
    margin:0;
    letter-spacing:0.3px;
  }
  .subtitle{
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    opacity:0.55;
    margin-top:4px;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    max-width:900px;
    width:100%;
    margin:0 auto;
    padding:8px 20px 26px;
  }

  .slots{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:clamp(14px, 3vw, 30px);
    margin-top:14px;
  }

  .slot{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .slot-label{
    font-family:'Baloo 2';
    font-weight:700;
    font-size:12px;
    color:var(--ink);
    opacity:0.7;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .slot-count{
    font-size:10px;
    font-weight:800;
    color:#fff;
    background:var(--leaf);
    border-radius:999px;
    padding:1px 7px;
    display:none;
  }
  .slot-count.show{ display:inline-block; }

  /* Pile: card-shaped drop target that fills with stacked cards */
  .pile{
    position:relative;
    width:var(--card-w);
    height: calc(var(--card-h) + 3 * var(--stack-offset));
    transition: transform .15s ease;
  }
  .pile-placeholder{
    position:absolute;
    top:0; left:0;
    width:var(--card-w);
    height:var(--card-h);
    border-radius:14px;
    border:2.5px dashed rgba(74,59,42,0.22);
    background:rgba(255,255,255,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    filter: brightness(0) opacity(0.25);
    transition: opacity .2s ease;
  }
  .pile-placeholder.hidden{ opacity:0; pointer-events:none; }

  .pile.drag-over .pile-placeholder{
    border-color: var(--accent);
    background: rgba(251,216,182,0.5);
  }
  .pile.drag-over{ transform: scale(1.06); }
  .pile.drag-over .stacked-card:last-child{
    box-shadow: 0 0 0 4px var(--accent-soft), 0 4px 8px var(--shadow);
  }
  .pile.wrong{ animation: shake .3s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  .stacked-card{
    position:absolute;
    left:0;
    width:var(--card-w);
    height:var(--card-h);
    border-radius:14px;
    background:var(--card);
    box-shadow: 0 3px 8px var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
  }
  .stacked-card.landing{
    animation: land .3s ease;
  }
  @keyframes land{
    0%{ transform: translateY(-18px) scale(0.85) rotate(0deg); opacity:0; }
    100%{ transform: translateY(0) scale(1) rotate(var(--rot)); opacity:1; }
  }

  .deck-area{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    margin-bottom:6px;
  }
  .hand-slot{
    width:var(--card-w);
    height:var(--card-h);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card{
    width:var(--card-w);
    height:var(--card-h);
    border-radius:16px;
    background:var(--card);
    box-shadow: 0 6px 14px var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:grab;
    touch-action:none;
    position:relative;
  }
  .card:active{ cursor:grabbing; }
  .card .emoji{ font-size:36px; }
  .card.dragging{
    position:fixed;
    z-index:999;
    pointer-events:none;
    transform: scale(1.1) rotate(-4deg);
  }

  .deck{
    width:var(--card-w);
    height:var(--card-h);
    border-radius:16px;
    background: linear-gradient(135deg, var(--accent), #D97F3F);
    box-shadow: 0 6px 14px var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition: transform .12s ease;
  }
  .deck:hover{ transform: translateY(-2px); }
  .deck:active{ transform: translateY(1px); }
  .deck::before, .deck::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:16px;
    background:linear-gradient(135deg, var(--accent), #D97F3F);
  }
  .deck::before{ transform: translate(3px,3px); z-index:-1; opacity:0.7; }
  .deck::after{ transform: translate(6px,6px); z-index:-2; opacity:0.4; }
  .deck .leaf-icon{ font-size:24px; opacity:0.9; }
  .deck.empty{
    background: transparent;
    box-shadow:none;
    cursor:default;
  }
  .deck.empty::before, .deck.empty::after{ display:none; }
  .deck-count{
    position:absolute;
    bottom:-9px;
    right:-9px;
    background:var(--ink);
    color:#fff;
    font-family:'Baloo 2';
    font-weight:700;
    font-size:11px;
    border-radius:999px;
    padding:2px 7px;
    border:2px solid var(--sky-bottom);
  }
  .tap-hint{
    font-size:11px;
    font-weight:700;
    color:var(--ink);
    opacity:0.45;
    text-align:center;
    margin-top:6px;
  }

  .toast{
    position:fixed;
    left:50%;
    top:16px;
    transform:translateX(-50%);
    background: var(--ink);
    color:#fff;
    font-weight:700;
    font-family:'Baloo 2';
    padding:8px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, top .25s ease;
    z-index:1001;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; top:26px; }

  .win-banner{
    position:fixed; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(74,59,42,0.45);
    z-index:1000;
  }
  .win-banner.show{ display:flex; }
  .win-card{
    background:var(--card);
    border-radius:24px;
    padding:34px 42px;
    text-align:center;
    box-shadow: 0 12px 26px rgba(0,0,0,0.25);
    max-width:88vw;
  }
  .win-card h2{
    font-family:'Baloo 2';
    color:var(--accent);
    font-size:30px;
    margin:0 0 6px;
  }
  .win-card p{
    font-weight:700;
    opacity:0.7;
    margin:0 0 20px;
  }
  .win-card button{
    font-family:'Baloo 2';
    font-weight:700;
    font-size:15px;
    color:#fff;
    background:var(--leaf);
    border:none;
    border-radius:999px;
    padding:10px 28px;
    cursor:pointer;
    box-shadow: 0 4px 0 #6f8b51;
  }
  .win-card button:active{ transform:translateY(2px); box-shadow:0 2px 0 #6f8b51; }

  .sound-toggle{
    position:fixed;
    top:16px;
    right:16px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 3px 8px var(--shadow);
    border:none;
    font-size:17px;
    cursor:pointer;
    z-index:900;
    display:flex;
    align-items:center;
    justify-content:center;
  }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle" title="Toggle sound">🔊</button>
<div class="toast" id="toast"></div>

<header>
  <h1>🌾 Barnyard Match</h1>
  <div class="subtitle">Draw a card and drag it onto its pile</div>
</header>

<main>
  <div class="slots" id="slots"></div>

  <div>
    <div class="deck-area">
      <div class="hand-slot" id="handSlot"></div>
      <div class="deck" id="deck">
        <span class="leaf-icon">🌿</span>
        <div class="deck-count" id="deckCount">24</div>
      </div>
    </div>
    <div class="tap-hint" id="tapHint">tap the deck to draw a card</div>
  </div>
</main>

<div class="win-banner" id="winBanner">
  <div class="win-card">
    <h2>🎉 All matched!</h2>
    <p>Every animal found its home.</p>
    <button id="playAgain">Play again</button>
  </div>
</div>

<script>
const ANIMALS = [
  { id:'cow',     label:'Cow',     emoji:'🐄' },
  { id:'chicken', label:'Chicken', emoji:'🐔' },
  { id:'rooster', label:'Rooster', emoji:'🐓' },
  { id:'pig',     label:'Pig',     emoji:'🐖' },
  { id:'sheep',   label:'Sheep',   emoji:'🐑' },
  { id:'duck',    label:'Duck',    emoji:'🦆' },
];
const CARDS_PER_ANIMAL = 4;

let deck = [];
let current = null;
let piles = {};
let dragEl = null;
let dragOffset = {x:0,y:0};
let dragOriginAnimal = null;
let soundOn = true;

const slotsEl = document.getElementById('slots');
const deckEl = document.getElementById('deck');
const handSlot = document.getElementById('handSlot');
const tapHint = document.getElementById('tapHint');
const winBanner = document.getElementById('winBanner');
const toastEl = document.getElementById('toast');
const soundToggle = document.getElementById('soundToggle');

soundToggle.addEventListener('click', ()=>{
  soundOn = !soundOn;
  soundToggle.textContent = soundOn ? '🔊' : '🔇';
});

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 900);
}

/* ---------- Sound synthesis ---------- */
let actx = null;
function ctx(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freqStart, freqEnd, dur, type, startTime, gainPeak=0.18){
  const c = ctx();
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, startTime);
  osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,20), startTime + dur);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(gainPeak, startTime + dur*0.15);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
  osc.connect(gain).connect(c.destination);
  osc.start(startTime);
  osc.stop(startTime + dur + 0.02);
}

const SOUNDS = {
  cow: () => {
    const c = ctx(); const t = c.currentTime;
    tone(160, 90, 0.55, 'sawtooth', t, 0.15);
    tone(165, 95, 0.55, 'sine', t, 0.1);
  },
  chicken: () => {
    const c = ctx(); const t = c.currentTime;
    tone(700, 520, 0.09, 'square', t, 0.12);
    tone(680, 480, 0.09, 'square', t + 0.13, 0.12);
    tone(760, 560, 0.1, 'square', t + 0.26, 0.12);
  },
  rooster: () => {
    const c = ctx(); const t = c.currentTime;
    tone(500, 900, 0.14, 'sawtooth', t, 0.14);
    tone(850, 650, 0.14, 'sawtooth', t + 0.15, 0.14);
    tone(700, 400, 0.3, 'sawtooth', t + 0.3, 0.12);
  },
  pig: () => {
    const c = ctx(); const t = c.currentTime;
    tone(280, 180, 0.12, 'square', t, 0.14);
    tone(260, 160, 0.12, 'square', t + 0.14, 0.14);
  },
  sheep: () => {
    const c = ctx(); const t = c.currentTime;
    tone(320, 260, 0.22, 'sawtooth', t, 0.14);
    tone(300, 240, 0.28, 'sawtooth', t + 0.2, 0.12);
  },
  duck: () => {
    const c = ctx(); const t = c.currentTime;
    tone(380, 280, 0.1, 'square', t, 0.13);
    tone(360, 260, 0.12, 'square', t + 0.12, 0.13);
  },
};
function playSound(animalId){
  if(!soundOn) return;
  try{ SOUNDS[animalId] && SOUNDS[animalId](); }catch(e){}
}

/* ---------- Game setup ---------- */
function buildSlots(){
  slotsEl.innerHTML = '';
  ANIMALS.forEach(a=>{
    piles[a.id] = 0;
    const wrap = document.createElement('div');
    wrap.className = 'slot';
    wrap.dataset.animal = a.id;
    wrap.innerHTML = `
      <div class="slot-label">${a.label} <span class="slot-count" id="count-${a.id}">0</span></div>
      <div class="pile" id="pile-${a.id}">
        <div class="pile-placeholder" id="placeholder-${a.id}">${a.emoji}</div>
      </div>
    `;
    slotsEl.appendChild(wrap);
  });
}

function buildDeck(){
  deck = [];
  ANIMALS.forEach(a=>{
    for(let i=0;i<CARDS_PER_ANIMAL;i++) deck.push(a.id);
  });
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  updateDeckUI();
}

function updateDeckUI(){
  const countEl = document.getElementById('deckCount');
  if(countEl) countEl.textContent = deck.length;
  if(deck.length===0){
    deckEl.classList.add('empty');
    deckEl.innerHTML = '';
  }
}

function animalById(id){ return ANIMALS.find(a=>a.id===id); }

function renderHand(){
  handSlot.innerHTML = '';
  if(!current){
    tapHint.textContent = deck.length > 0 ? 'tap the deck to draw a card' : 'no more cards';
    return;
  }
  tapHint.textContent = 'drag the card onto its pile';
  const a = animalById(current);
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'currentCard';
  card.innerHTML = `<div class="emoji">${a.emoji}</div>`;
  handSlot.appendChild(card);
  attachDrag(card);
}

deckEl.addEventListener('click', ()=>{
  if(current || deck.length===0) return;
  current = deck.pop();
  updateDeckUI();
  renderHand();
});

function attachDrag(card){
  card.addEventListener('pointerdown', onPointerDown);
}

function onPointerDown(e){
  const card = e.currentTarget;
  e.preventDefault();
  const rect = card.getBoundingClientRect();
  dragOffset.x = e.clientX - rect.left;
  dragOffset.y = e.clientY - rect.top;
  dragOriginAnimal = current;

  dragEl = card.cloneNode(true);
  dragEl.classList.add('dragging');
  dragEl.style.left = rect.left + 'px';
  dragEl.style.top = rect.top + 'px';
  document.body.appendChild(dragEl);
  card.style.visibility = 'hidden';

  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
}

function onPointerMove(e){
  if(!dragEl) return;
  dragEl.style.left = (e.clientX - dragOffset.x) + 'px';
  dragEl.style.top = (e.clientY - dragOffset.y) + 'px';

  document.querySelectorAll('.pile').forEach(p=>p.classList.remove('drag-over'));
  dragEl.style.pointerEvents = 'none';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const pile = el && el.closest('.pile');
  if(pile) pile.classList.add('drag-over');
}

function onPointerUp(e){
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  if(!dragEl) return;

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const pile = el && el.closest('.pile');
  document.querySelectorAll('.pile').forEach(p=>p.classList.remove('drag-over'));

  const origCard = document.getElementById('currentCard');
  const slotWrap = pile && pile.closest('.slot');

  if(slotWrap && slotWrap.dataset.animal === dragOriginAnimal){
    placeOnPile(dragOriginAnimal);
    current = null;
    if(origCard) origCard.remove();
    renderHand();
    checkWin();
  } else if(pile){
    pile.classList.add('wrong');
    setTimeout(()=>pile.classList.remove('wrong'), 300);
    showToast("Not quite — try again!");
    if(origCard) origCard.style.visibility = 'visible';
  } else {
    if(origCard) origCard.style.visibility = 'visible';
  }

  dragEl.remove();
  dragEl = null;
}

function placeOnPile(animalId){
  const index = piles[animalId]; // 0-based position of the new card
  piles[animalId]++;
  const a = animalById(animalId);

  const placeholder = document.getElementById('placeholder-' + animalId);
  if(placeholder) placeholder.classList.add('hidden');

  const pileEl = document.getElementById('pile-' + animalId);
  const rot = (index % 2 === 0 ? -1 : 1) * (3 + (index % 3));
  const stacked = document.createElement('div');
  stacked.className = 'stacked-card landing';
  stacked.style.setProperty('--rot', rot + 'deg');
  stacked.style.top = (index * 16) + 'px';
  stacked.style.zIndex = index;
  stacked.style.transform = `rotate(${rot}deg)`;
  stacked.innerHTML = `<div class="emoji">${a.emoji}</div>`;
  pileEl.appendChild(stacked);

  const countEl = document.getElementById('count-' + animalId);
  countEl.textContent = piles[animalId];
  countEl.classList.add('show');

  showToast(`${a.label} matched!`);
  playSound(animalId);
}

function checkWin(){
  const total = ANIMALS.reduce((s,a)=> s + piles[a.id], 0);
  if(total === ANIMALS.length * CARDS_PER_ANIMAL){
    setTimeout(()=> winBanner.classList.add('show'), 400);
  }
}

document.getElementById('playAgain').addEventListener('click', ()=>{
  winBanner.classList.remove('show');
  current = null;
  deckEl.classList.remove('empty');
  deckEl.innerHTML = '<span class="leaf-icon">🌿</span><div class="deck-count" id="deckCount">24</div>';
  buildSlots();
  buildDeck();
  renderHand();
});

/* init */
buildSlots();
buildDeck();
renderHand();
</script>
</body>
</html>
