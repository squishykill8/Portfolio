<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rune Slide — Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#181225;
    --bg-mid:#241a38;
    --panel:#2c2144;
    --panel-edge:#3d2d5c;
    --gold:#f2b632;
    --gold-dim:#a97f2b;
    --ink:#f1e9ff;
    --ink-dim:#b7a8d6;
    --hp-mon:#ff5566;
    --hp-mon-dim:#a02535;
    --hp-ply:#43d17a;
    --hp-ply-dim:#1f8a4c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background: radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 65%);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 16px 20px;
    width:100%;
    max-width:400px;
    position:relative;
  }
  .view{ display:flex; flex-direction:column; align-items:center; width:100%; }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:0.5px;
    margin:0 0 2px;
    color:var(--gold);
    text-shadow:0 2px 0 rgba(0,0,0,0.35);
  }
  .subtitle{
    font-size:12.5px;
    color:var(--ink-dim);
    margin:0 0 14px;
    text-align:center;
    line-height:1.5;
    max-width:330px;
  }

  /* battle select */
  .level-list{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; }
  .level-card{
    display:flex; align-items:center; gap:12px;
    text-align:left;
    background:linear-gradient(180deg, var(--panel), var(--bg-mid));
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:10px 14px;
    cursor:pointer;
    color:var(--ink);
    font-family:'Nunito', sans-serif;
  }
  .level-card:active{ transform:translateY(1px); }
  .level-card-emoji{ font-size:32px; line-height:1; }
  .level-card-name{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px; color:var(--gold); }
  .level-card-meta{ font-size:11.5px; color:var(--ink-dim); margin-top:1px; }
  .level-card-weak{ font-size:11.5px; display:flex; align-items:center; gap:5px; margin-top:2px; }
  .swatch{ width:10px; height:10px; border-radius:3px; display:inline-block; flex-shrink:0; }

  /* game topbar */
  .game-topbar{
    display:flex; justify-content:space-between; align-items:center;
    width:100%; max-width:340px; margin-bottom:10px;
  }
  .icon-btn{
    font-family:'Baloo 2', sans-serif; font-size:12px; font-weight:600;
    color:var(--ink-dim); background:transparent; border:1px solid var(--panel-edge);
    border-radius:9px; padding:5px 10px; cursor:pointer;
  }

  /* monster panel */
  .monster-panel{
    display:flex; align-items:center; gap:12px;
    width:100%; max-width:340px;
    background:linear-gradient(180deg, var(--panel), var(--bg-mid));
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:9px;
  }
  .monster-sprite{
    font-size:44px; line-height:1;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    transition:transform 0.12s ease;
  }
  .monster-sprite.hit{ animation:hitFlash 0.35s ease; }
  .monster-sprite.attack{ animation:lunge 0.5s ease; }
  @keyframes hitFlash{
    0%{ transform:translateX(0); filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5)) brightness(1); }
    25%{ transform:translateX(-4px); filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5)) brightness(2.4) saturate(0) sepia(1) hue-rotate(-50deg) saturate(6); }
    55%{ transform:translateX(4px); }
    100%{ transform:translateX(0); filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5)) brightness(1); }
  }
  @keyframes lunge{
    0%{ transform:translateY(0) scale(1); }
    35%{ transform:translateY(6px) scale(0.94); }
    55%{ transform:translateY(-10px) scale(1.08); }
    100%{ transform:translateY(0) scale(1); }
  }
  .monster-info{ flex:1; min-width:0; }
  .monster-name{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px; color:var(--gold); }
  .weak-tag{ font-size:11.5px; color:var(--ink-dim); display:flex; align-items:center; gap:5px; margin:2px 0 6px; }
  .hp-row{ display:flex; align-items:center; gap:8px; }
  .hp-track{ flex:1; height:10px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .hp-fill{ height:100%; border-radius:6px; transition:width 0.5s cubic-bezier(.3,.7,.4,1); }
  .hp-fill.monster{ background:linear-gradient(90deg, var(--hp-mon-dim), var(--hp-mon)); width:100%; }
  .hp-fill.player{ background:linear-gradient(90deg, var(--hp-ply-dim), var(--hp-ply)); width:100%; }
  .hp-label{ font-family:'Baloo 2', sans-serif; font-size:11px; color:var(--ink-dim); white-space:nowrap; }

  /* turn bar */
  .turn-bar{
    width:100%; max-width:340px;
    background:linear-gradient(180deg, var(--panel), var(--bg-mid));
    border:1px solid var(--panel-edge);
    border-radius:12px;
    padding:8px 12px;
    margin-bottom:9px;
  }
  .turn-label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'Baloo 2', sans-serif; font-size:12.5px; color:var(--ink-dim);
    margin-bottom:6px;
  }
  .turn-label b{ font-size:16px; color:var(--gold); }
  .turn-label .loaded{ color:var(--ink-dim); font-weight:400; font-family:'Nunito',sans-serif; font-size:11.5px; }
  .turn-label .loaded b{ color:var(--ink); font-size:13px; }
  .turn-track{ height:7px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .collected-row{ display:flex; gap:6px; margin-top:8px; }
  .collected-chip{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--panel-edge);
    border-radius:9px;
    padding:5px 4px 4px;
  }
  .collected-chip .dot{ width:15px; height:15px; border-radius:5px; box-shadow:inset 0 -2px 3px rgba(0,0,0,0.3), inset 0 2px 2px rgba(255,255,255,0.4); }
  .collected-chip .count{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px; color:var(--ink); }
  .collected-chip.weak{ border-color:var(--gold); background:rgba(242,182,50,0.1); }
  .collected-chip.weak .count{ color:var(--gold); }
  .turn-fill{ height:100%; width:100%; border-radius:4px; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); transition:width 0.1s linear, background 0.2s ease; }
  .turn-bar.urgent .turn-fill{ background:linear-gradient(90deg, #a02535, #ff5566); }
  .turn-bar.urgent .turn-label b{ color:#ff6b6b; }

  /* player panel */
  .player-panel{ width:100%; max-width:340px; margin-top:10px; }
  .player-panel .hp-label{ min-width:56px; text-align:right; }

  .board-wrap{
    position:relative;
    padding:12px;
    border-radius:20px;
    background:linear-gradient(155deg, #3a2b5a, #241a38 60%);
    border:1px solid var(--panel-edge);
    box-shadow: 0 18px 40px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .board-wrap.shake{ animation:shake 0.4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(3px); }
  }
  .board{
    position:relative;
    background:
      repeating-conic-gradient(from 0deg, rgba(255,255,255,0.028) 0% 25%, transparent 0% 50%) 0 0/44px 44px,
      #191129;
    border-radius:13px;
    overflow:hidden;
    box-shadow:inset 0 3px 14px rgba(0,0,0,0.55);
  }
  .track-highlight{
    position:absolute;
    background:linear-gradient(180deg, rgba(242,182,50,0.14), rgba(242,182,50,0.05));
    pointer-events:none; opacity:0; transition:opacity 0.15s ease; z-index:1;
  }
  .track-highlight.show{ opacity:1; }
  .socket{ position:absolute; border-radius:11px; background:rgba(0,0,0,0.22); box-shadow:inset 0 2px 5px rgba(0,0,0,0.4); z-index:0; }
  .piece{
    position:absolute; border-radius:11px; will-change:transform;
    transition:transform 0.19s cubic-bezier(.34,1.56,.64,1), opacity 0.16s ease;
    z-index:2;
  }
  .piece.dragging{ transition:none; z-index:5; }
  .piece.clearing{ transition:transform 0.22s ease, opacity 0.22s ease; transform-origin:center; }
  .footer-hint{ margin-top:12px; font-size:11px; color:var(--ink-dim); text-align:center; opacity:0.8; }

  .combo-pop{
    position:absolute;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    color:var(--gold); text-shadow:0 2px 6px rgba(0,0,0,0.6);
    pointer-events:none !important; z-index:6;
    animation:popUp 0.75s ease forwards;
  }
  .combo-pop.dmg-mon{ color:#ff8a8a; font-size:18px; }
  .combo-pop.dmg-ply{ color:#ff8a8a; font-size:18px; }
  .combo-pop.super{ color:#ffe066; }
  @keyframes popUp{
    0%{ opacity:0; transform:translate(-50%,-40%) scale(0.7); }
    18%{ opacity:1; transform:translate(-50%,-100%) scale(1.05); }
    100%{ opacity:0; transform:translate(-50%,-170%) scale(1); }
  }

  #fxLayer{ position:absolute; inset:0; pointer-events:none; z-index:14; overflow:visible; }
  .projectile{
    position:absolute; width:13px; height:13px; border-radius:50%;
    box-shadow:0 0 8px rgba(255,255,255,0.5), inset 0 2px 3px rgba(255,255,255,0.55);
    transform:translate(0,0) scale(1); opacity:1;
    transition:transform 0.42s cubic-bezier(.3,.6,.4,1), opacity 0.42s ease 0.2s;
    z-index:14;
  }

  .reset-btn{
    margin-top:12px; font-family:'Baloo 2', sans-serif; font-size:13px; font-weight:600;
    color:var(--bg-deep); background:linear-gradient(180deg, var(--gold), var(--gold-dim));
    border:none; padding:9px 18px; border-radius:10px; cursor:pointer;
    box-shadow:0 3px 0 #7a5a1f, 0 6px 14px rgba(0,0,0,0.35);
  }
  .reset-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #7a5a1f; }
  .reset-btn.ghost{ color:var(--ink); background:transparent; border:1px solid var(--panel-edge); box-shadow:none; }
  .reset-btn.ghost:active{ box-shadow:none; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(10,7,18,0.72); display:flex; align-items:center; justify-content:center; z-index:20; }
  .modal-card{
    background:linear-gradient(165deg, #3a2b5a, #201731);
    border:1px solid var(--panel-edge); border-radius:18px; padding:26px 28px;
    max-width:300px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .modal-title{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px; margin-bottom:6px; }
  .modal-title.win{ color:var(--gold); }
  .modal-title.lose{ color:#ff7a7a; }
  .modal-msg{ font-size:13px; color:var(--ink-dim); margin-bottom:16px; line-height:1.5; }
  .modal-actions{ display:flex; flex-direction:column; gap:8px; }
  .modal-actions .reset-btn{ margin-top:0; width:100%; }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="view" id="menuView">
    <h1>Rune Slide — Battle</h1>
    <p class="subtitle">Match gems to load elemental damage. You get 10 seconds each turn before the enemy strikes back.</p>
    <div class="level-list" id="levelList"></div>
  </div>

  <div class="view" id="gameView" style="display:none;">
    <div class="game-topbar">
      <button class="icon-btn" id="backBtn">&larr; Battles</button>
      <button class="icon-btn" id="restartBtn">Restart</button>
    </div>

    <div class="monster-panel">
      <div class="monster-sprite" id="monsterSprite">🟢</div>
      <div class="monster-info">
        <div class="monster-name" id="monsterName">Slime</div>
        <div class="weak-tag" id="weakTag">Weak to <span class="swatch"></span> Fire</div>
        <div class="hp-row">
          <div class="hp-track"><div class="hp-fill monster" id="monsterHpFill"></div></div>
          <div class="hp-label" id="monsterHpLabel">260/260</div>
        </div>
      </div>
    </div>

    <div class="turn-bar" id="turnBar">
      <div class="turn-label">
        <span>Your Turn &middot; <b id="turnTimerVal">10.0</b>s</span>
        <span class="loaded">Loaded <b id="turnDamageVal">0</b> dmg</span>
      </div>
      <div class="turn-track"><div class="turn-fill" id="turnFill"></div></div>
      <div class="collected-row" id="collectedRow"></div>
    </div>

    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board"></div>
    </div>

    <div class="player-panel">
      <div class="hp-row">
        <div class="hp-track"><div class="hp-fill player" id="playerHpFill"></div></div>
        <div class="hp-label" id="playerHpLabel">200/200</div>
      </div>
    </div>

    <p class="footer-hint">Rows slide left/right &middot; columns slide up/down &middot; off one edge, on the other</p>
  </div>

  <div id="fxLayer"></div>
</div>

<div class="modal-overlay" id="endModal" style="display:none;">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-actions">
      <button class="reset-btn" id="retryBtn">Retry Battle</button>
      <button class="reset-btn" id="nextBtn">Next Battle</button>
      <button class="reset-btn ghost" id="menuBtn2">Back to Battles</button>
    </div>
  </div>
</div>

<script>
(function(){
  const ROWS = 6, COLS = 6, CELL = 44;
  const PLAYER_MAX_HP = 200;
  const TURN_SECONDS = 10;

  const ELEMENTS = [
    { name:'Fire',  hex:'#ef4565', color:'linear-gradient(160deg,#ff6b86,#ef4565 65%,#c22548)', icon:'🔥' },
    { name:'Water', hex:'#3d84f1', color:'linear-gradient(160deg,#6fa8ff,#3d84f1 65%,#1f5fce)', icon:'💧' },
    { name:'Wood',  hex:'#1fc978', color:'linear-gradient(160deg,#5fe0a0,#1fc978 65%,#0f9a5a)', icon:'🌿' },
    { name:'Light', hex:'#f5c623', color:'linear-gradient(160deg,#ffe066,#f5c623 65%,#c9970e)', icon:'✨' },
    { name:'Dark',  hex:'#a463ff', color:'linear-gradient(160deg,#c497ff,#a463ff 65%,#7c3cd6)', icon:'🌑' },
  ];

  // ---- Encounter data: each fight is just numbers + an emoji, engine unchanged. ----
  const ENCOUNTERS = [
    { name:'Slime',        emoji:'🟢', hp:440, weakness:0, atkMin:8,  atkMax:14 },
    { name:'Stone Golem',  emoji:'🗿', hp:760, weakness:1, atkMin:12, atkMax:18 },
    { name:'Will-o-Wisp',  emoji:'👻', hp:600, weakness:4, atkMin:10, atkMax:16 },
    { name:'Shadow Wyrm',  emoji:'🐉', hp:1120, weakness:3, atkMin:16, atkMax:24 },
  ];

  const stageEl = document.getElementById('stage');
  const menuView = document.getElementById('menuView');
  const gameView = document.getElementById('gameView');
  const levelListEl = document.getElementById('levelList');
  const boardEl = document.getElementById('board');
  const boardWrapEl = document.getElementById('boardWrap');
  const fxLayer = document.getElementById('fxLayer');

  const monsterSpriteEl = document.getElementById('monsterSprite');
  const monsterNameEl = document.getElementById('monsterName');
  const weakTagEl = document.getElementById('weakTag');
  const monsterHpFillEl = document.getElementById('monsterHpFill');
  const monsterHpLabelEl = document.getElementById('monsterHpLabel');
  const playerHpFillEl = document.getElementById('playerHpFill');
  const playerHpLabelEl = document.getElementById('playerHpLabel');

  const turnBarEl = document.getElementById('turnBar');
  const turnTimerValEl = document.getElementById('turnTimerVal');
  const turnDamageValEl = document.getElementById('turnDamageVal');
  const turnFillEl = document.getElementById('turnFill');
  const collectedRowEl = document.getElementById('collectedRow');

  const backBtn = document.getElementById('backBtn');
  const restartBtn = document.getElementById('restartBtn');
  const endModal = document.getElementById('endModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalMsg = document.getElementById('modalMsg');
  const retryBtn = document.getElementById('retryBtn');
  const nextBtn = document.getElementById('nextBtn');
  const menuBtn2 = document.getElementById('menuBtn2');

  boardEl.style.width = (COLS*CELL) + 'px';
  boardEl.style.height = (ROWS*CELL) + 'px';

  const rowHighlight = document.createElement('div');
  rowHighlight.className = 'track-highlight';
  rowHighlight.style.height = CELL + 'px';
  const colHighlight = document.createElement('div');
  colHighlight.className = 'track-highlight';
  colHighlight.style.width = CELL + 'px';
  boardEl.appendChild(rowHighlight);
  boardEl.appendChild(colHighlight);

  // ---- runtime state ----
  let board = [];
  let rowActiveCols = [], colActiveRows = [];
  let currentEncounterIndex = 0;
  let currentEncounter = null;
  let pieceTypeCount = ELEMENTS.length;
  let isResolving = false;
  let battleEnded = false;
  let drag = null;
  let lastMatchCenter = null;

  let monsterHp = 0, monsterMaxHp = 0, playerHp = 0;
  let colorPool = {};
  let collectedChipEls = [];
  let turnTimeLeft = TURN_SECONDS;
  let turnEnded = false;
  let turnResolved = false;
  let tickHandle = null;

  function mod(n, m){ return ((n % m) + m) % m; }
  function randInt(a,b){ return Math.floor(a + Math.random()*(b-a+1)); }

  function buildCollectedChips(){
    collectedRowEl.innerHTML = '';
    collectedChipEls = ELEMENTS.map((el) => {
      const chip = document.createElement('div');
      chip.className = 'collected-chip';
      chip.innerHTML = `<div class="dot" style="background:${el.color}"></div><div class="count">0</div>`;
      collectedRowEl.appendChild(chip);
      return { chip, countEl: chip.querySelector('.count') };
    });
  }

  function buildLevelList(){
    levelListEl.innerHTML = '';
    ENCOUNTERS.forEach((enc, idx) => {
      const card = document.createElement('button');
      card.className = 'level-card';
      const w = ELEMENTS[enc.weakness];
      card.innerHTML = `
        <div class="level-card-emoji">${enc.emoji}</div>
        <div>
          <div class="level-card-name">${enc.name}</div>
          <div class="level-card-meta">${enc.hp} HP &middot; hits for ${enc.atkMin}-${enc.atkMax}</div>
          <div class="level-card-weak"><span class="swatch" style="background:${w.hex}"></span>Weak to ${w.icon} ${w.name}</div>
        </div>
      `;
      card.addEventListener('click', () => openEncounter(idx));
      levelListEl.appendChild(card);
    });
  }

  function openEncounter(idx){
    currentEncounterIndex = idx;
    currentEncounter = ENCOUNTERS[idx];
    menuView.style.display = 'none';
    gameView.style.display = 'flex';
    nextBtn.style.display = (idx < ENCOUNTERS.length - 1) ? 'block' : 'none';
    startEncounter();
  }

  function backToMenu(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    endModal.style.display = 'none';
    gameView.style.display = 'none';
    menuView.style.display = 'flex';
  }

  function parseMask(mask){
    rowActiveCols = []; colActiveRows = [];
    for(let r=0;r<ROWS;r++) rowActiveCols.push([]);
    for(let c=0;c<COLS;c++) colActiveRows.push([]);
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const active = !mask || mask[r][c] === '1';
        if(active){ rowActiveCols[r].push(c); colActiveRows[c].push(r); }
      }
    }
  }
  function isActive(r,c){ return rowActiveCols[r].includes(c); }

  function randType(excludeCheck){
    let t;
    do { t = Math.floor(Math.random()*pieceTypeCount); } while (excludeCheck && excludeCheck(t));
    return t;
  }

  function makePieceEl(type){
    const el = document.createElement('div');
    el.className = 'piece';
    const size = CELL - 7;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = ELEMENTS[type].color;
    el.style.boxShadow = 'inset 0 -4px 7px rgba(0,0,0,0.28), inset 0 3px 5px rgba(255,255,255,0.4), 0 3px 6px rgba(0,0,0,0.3)';
    boardEl.appendChild(el);
    return el;
  }

  function pieceX(col){ return col*CELL + 3.5; }
  function pieceY(row){ return row*CELL + 3.5; }

  function setTransform(p, animate){
    if(!animate) p.el.classList.add('dragging');
    else p.el.classList.remove('dragging');
    p.el.style.transform = `translate(${pieceX(p.col)}px, ${pieceY(p.row)}px)`;
  }

  function startEncounter(){
    battleEnded = false;
    endModal.style.display = 'none';
    pieceTypeCount = ELEMENTS.length;
    parseMask(null);

    boardEl.querySelectorAll('.piece, .socket').forEach(el => el.remove());

    board = [];
    for(let r=0;r<ROWS;r++){
      const row = [];
      for(let c=0;c<COLS;c++){
        const type = randType(t => {
          const left1 = c>=1 ? row[c-1] : null;
          const left2 = c>=2 ? row[c-2] : null;
          const up1 = r>=1 ? board[r-1][c] : null;
          const up2 = r>=2 ? board[r-2][c] : null;
          const leftPair = left1 && left2 && left1.type===t && left2.type===t;
          const upPair = up1 && up2 && up1.type===t && up2.type===t;
          return leftPair || upPair;
        });
        const el = makePieceEl(type);
        const piece = { type, row:r, col:c, el };
        setTransform(piece, false);
        row.push(piece);
      }
      board.push(row);
    }

    monsterHp = currentEncounter.hp;
    monsterMaxHp = currentEncounter.hp;
    playerHp = PLAYER_MAX_HP;
    monsterSpriteEl.textContent = currentEncounter.emoji;
    monsterNameEl.textContent = currentEncounter.name;
    const w = ELEMENTS[currentEncounter.weakness];
    weakTagEl.innerHTML = `Weak to <span class="swatch" style="background:${w.hex}"></span> ${w.icon} ${w.name}`;
    collectedChipEls.forEach((c, idx) => {
      c.chip.classList.toggle('weak', idx === currentEncounter.weakness);
    });
    updateMonsterHpUI();
    updatePlayerHpUI();

    if(tickHandle){ clearInterval(tickHandle); }
    tickHandle = setInterval(tick, 100);
    startNewTurn();
  }

  function updateMonsterHpUI(){
    monsterHpFillEl.style.width = Math.max(0, monsterHp/monsterMaxHp*100) + '%';
    monsterHpLabelEl.textContent = `${Math.max(0,monsterHp)}/${monsterMaxHp}`;
  }
  function updatePlayerHpUI(){
    playerHpFillEl.style.width = Math.max(0, playerHp/PLAYER_MAX_HP*100) + '%';
    playerHpLabelEl.textContent = `${Math.max(0,playerHp)}/${PLAYER_MAX_HP}`;
  }

  function computeLoadedDamage(){
    let dmg = 0;
    Object.keys(colorPool).forEach(tStr => {
      const t = +tStr;
      let d = colorPool[t] * 5;
      if(t === currentEncounter.weakness) d *= 2;
      dmg += d;
    });
    return Math.round(dmg);
  }

  function updateTurnUI(){
    turnTimerValEl.textContent = turnTimeLeft.toFixed(1);
    turnFillEl.style.width = Math.max(0, turnTimeLeft/TURN_SECONDS*100) + '%';
    turnDamageValEl.textContent = computeLoadedDamage();
    turnBarEl.classList.toggle('urgent', turnTimeLeft <= 3 && turnTimeLeft > 0);
    collectedChipEls.forEach((c, idx) => {
      c.countEl.textContent = colorPool[idx] || 0;
    });
  }

  function startNewTurn(){
    colorPool = {};
    turnTimeLeft = TURN_SECONDS;
    turnEnded = false;
    turnResolved = false;
    updateTurnUI();
  }

  function tick(){
    if(turnEnded || battleEnded) return;
    turnTimeLeft = Math.max(0, turnTimeLeft - 0.1);
    updateTurnUI();
    if(turnTimeLeft <= 0){
      turnEnded = true;
      if(!isResolving) endPlayerTurn();
    }
  }

  function cellFromEvent(e){
    const rect = boardEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    if(x<0||y<0||x>=COLS*CELL||y>=ROWS*CELL) return null;
    return { row: Math.floor(y/CELL), col: Math.floor(x/CELL) };
  }

  function onPointerDown(e){
    if(isResolving || battleEnded || turnEnded) return;
    const cell = cellFromEvent(e);
    if(!cell) return;
    boardEl.setPointerCapture(e.pointerId);
    drag = { row: cell.row, col: cell.col, axis: null, startX: e.clientX, startY: e.clientY, offset: 0 };
  }

  function beginAxis(axis){
    drag.axis = axis;
    if(axis === 'row'){
      drag.cols = rowActiveCols[drag.row];
      drag.n = drag.cols.length;
      drag.leftPx = drag.cols.length ? drag.cols[0]*CELL : 0;
      drag.pieces = drag.cols.map(c => board[drag.row][c]);
      rowHighlight.style.width = (drag.n*CELL) + 'px';
      rowHighlight.style.transform = `translate(${drag.leftPx}px, ${drag.row*CELL}px)`;
      rowHighlight.classList.add('show');
    } else {
      drag.rows = colActiveRows[drag.col];
      drag.n = drag.rows.length;
      drag.topPx = drag.rows.length ? drag.rows[0]*CELL : 0;
      drag.pieces = drag.rows.map(r => board[r][drag.col]);
      colHighlight.style.height = (drag.n*CELL) + 'px';
      colHighlight.style.transform = `translate(${drag.col*CELL}px, ${drag.topPx}px)`;
      colHighlight.classList.add('show');
    }
    drag.pieces.forEach(p => p.el.classList.add('dragging'));
  }

  function onPointerMove(e){
    if(!drag || isResolving) return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    if(!drag.axis){
      if(Math.abs(dx) > 7 || Math.abs(dy) > 7){
        beginAxis(Math.abs(dx) > Math.abs(dy) ? 'row' : 'col');
      } else { return; }
    }
    if(drag.n === 0) return;
    const total = drag.n*CELL;
    if(drag.axis === 'row'){
      drag.offset = dx;
      drag.pieces.forEach((p,i) => {
        const x = drag.leftPx + mod(i*CELL + drag.offset, total) + 3.5;
        p.el.style.transform = `translate(${x}px, ${pieceY(p.row)}px)`;
      });
    } else {
      drag.offset = dy;
      drag.pieces.forEach((p,i) => {
        const y = drag.topPx + mod(i*CELL + drag.offset, total) + 3.5;
        p.el.style.transform = `translate(${pieceX(p.col)}px, ${y}px)`;
      });
    }
  }

  function rotateRow(r, shift){
    const cols = rowActiveCols[r];
    const n = cols.length;
    if(n===0) return false;
    const s = mod(shift, n);
    if(s===0) return false;
    const oldVals = cols.map(c => board[r][c]);
    for(let i=0;i<n;i++){
      const newCol = cols[mod(i+s, n)];
      board[r][newCol] = oldVals[i];
      board[r][newCol].col = newCol;
    }
    return true;
  }

  function rotateCol(c, shift){
    const rows = colActiveRows[c];
    const n = rows.length;
    if(n===0) return false;
    const s = mod(shift, n);
    if(s===0) return false;
    const oldVals = rows.map(r => board[r][c]);
    for(let i=0;i<n;i++){
      const newRow = rows[mod(i+s, n)];
      board[newRow][c] = oldVals[i];
      board[newRow][c].row = newRow;
    }
    return true;
  }

  function onPointerUp(e){
    if(!drag) return;
    rowHighlight.classList.remove('show');
    colHighlight.classList.remove('show');
    if(drag.axis && drag.n > 0){
      const shift = Math.round(drag.offset / CELL);
      if(drag.axis === 'row'){
        rotateRow(drag.row, shift);
        drag.cols.forEach(c => setTransform(board[drag.row][c], true));
      } else {
        rotateCol(drag.col, shift);
        drag.rows.forEach(r => setTransform(board[r][drag.col], true));
      }
      drag = null;
      setTimeout(() => resolveBoard(true), 190);
    } else {
      drag = null;
    }
  }

  function findMatches(){
    const matched = new Set();
    for(let r=0;r<ROWS;r++){
      let runStart = 0, runType = null;
      for(let c=0;c<=COLS;c++){
        const cell = c<COLS ? board[r][c] : null;
        const t = cell ? cell.type : null;
        if(t !== null && t === runType){ continue; }
        if(runType !== null && (c - runStart) >= 3){
          for(let k=runStart;k<c;k++) matched.add(board[r][k]);
        }
        runStart = c; runType = t;
      }
    }
    for(let c=0;c<COLS;c++){
      let runStart = 0, runType = null;
      for(let r=0;r<=ROWS;r++){
        const cell = r<ROWS ? board[r][c] : null;
        const t = cell ? cell.type : null;
        if(t !== null && t === runType){ continue; }
        if(runType !== null && (r - runStart) >= 3){
          for(let k=runStart;k<r;k++) matched.add(board[k][c]);
        }
        runStart = r; runType = t;
      }
    }
    return matched;
  }

  function showFloatPop(text, x, y, cls){
    const pop = document.createElement('div');
    pop.className = 'combo-pop' + (cls ? (' '+cls) : '');
    pop.textContent = text;
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    boardEl.appendChild(pop);
    setTimeout(() => pop.remove(), 780);
  }

  function showStagePop(text, point, cls){
    const pop = document.createElement('div');
    pop.className = 'combo-pop' + (cls ? (' '+cls) : '');
    pop.textContent = text;
    pop.style.left = point.x + 'px';
    pop.style.top = point.y + 'px';
    fxLayer.appendChild(pop);
    setTimeout(() => pop.remove(), 780);
  }

  function resolveBoard(isFirstPass){
    const matched = findMatches();
    if(matched.size === 0){
      isResolving = false;
      if(turnEnded && !turnResolved) endPlayerTurn();
      return;
    }
    isResolving = true;

    let sumX=0, sumY=0;
    const passCounts = {};
    matched.forEach(p => {
      sumX += p.col*CELL + CELL/2;
      sumY += p.row*CELL + CELL/2;
      passCounts[p.type] = (passCounts[p.type]||0) + 1;
    });
    lastMatchCenter = { x: sumX/matched.size, y: sumY/matched.size };

    let passDamage = 0, superEffective = false;
    Object.keys(passCounts).forEach(tStr => {
      const t = +tStr;
      colorPool[t] = (colorPool[t]||0) + passCounts[t];
      let d = passCounts[t]*5;
      if(t === currentEncounter.weakness){ d *= 2; superEffective = true; }
      passDamage += d;
    });

    showFloatPop(
      superEffective ? `+${passDamage} Super Effective!` : `+${passDamage}`,
      lastMatchCenter.x, lastMatchCenter.y,
      superEffective ? 'super' : ''
    );
    updateTurnUI();

    matched.forEach(p => {
      p.el.classList.add('clearing');
      p.el.style.opacity = '0';
      p.el.style.transform += ' scale(0.3)';
    });

    setTimeout(() => {
      matched.forEach(p => { p.el.remove(); board[p.row][p.col] = null; });
      collapseAndRefill();
      setTimeout(() => resolveBoard(false), 260);
    }, 220);
  }

  function collapseAndRefill(){
    for(let c=0;c<COLS;c++){
      const rows = colActiveRows[c];
      if(rows.length === 0) continue;
      const top = rows[0], bottom = rows[rows.length-1];
      const remaining = [];
      for(let r=bottom;r>=top;r--){ if(board[r][c]) remaining.push(board[r][c]); }
      let writeRow = bottom;
      for(const p of remaining){
        p.row = writeRow;
        board[writeRow][c] = p;
        setTransform(p, true);
        writeRow--;
      }
      let spawnOffset = 1;
      for(let r=writeRow;r>=top;r--){
        const type = randType();
        const el = makePieceEl(type);
        const piece = { type, row:r, col:c, el };
        el.style.transform = `translate(${pieceX(c)}px, ${pieceY(top-spawnOffset)}px)`;
        board[r][c] = piece;
        spawnOffset++;
      }
    }
    void boardEl.offsetHeight;
    for(let c=0;c<COLS;c++){
      const rows = colActiveRows[c];
      for(const r of rows) setTransform(board[r][c], true);
    }
  }

  // ---- combat sequence ----
  function pointRelative(rect, stageRect){
    return { x: rect.left + rect.width/2 - stageRect.left, y: rect.top + rect.height/2 - stageRect.top };
  }

  function spawnProjectile(hex, from, to, delay){
    setTimeout(() => {
      const dot = document.createElement('div');
      dot.className = 'projectile';
      dot.style.background = hex;
      dot.style.left = from.x + 'px';
      dot.style.top = from.y + 'px';
      fxLayer.appendChild(dot);
      requestAnimationFrame(() => {
        dot.style.transform = `translate(${to.x-from.x}px, ${to.y-from.y}px) scale(0.4)`;
        dot.style.opacity = '0.1';
      });
      setTimeout(() => dot.remove(), 700);
    }, delay);
  }

  function endPlayerTurn(){
    if(turnResolved) return;
    turnResolved = true;
    playerAttack();
  }

  function playerAttack(){
    const dmg = computeLoadedDamage();
    const stageRect = stageEl.getBoundingClientRect();
    const boardRect = boardEl.getBoundingClientRect();
    const monsterRect = monsterSpriteEl.getBoundingClientRect();
    const from = pointRelative(boardRect, stageRect);
    const to = pointRelative(monsterRect, stageRect);

    let dots = [];
    Object.keys(colorPool).forEach(tStr => {
      const t = +tStr;
      const n = Math.min(colorPool[t], 6);
      for(let i=0;i<n;i++) dots.push(t);
    });

    if(dots.length === 0){
      finishPlayerAttack(dmg);
      return;
    }
    dots.forEach((type, i) => {
      spawnProjectile(ELEMENTS[type].hex, from, to, i*55);
    });
    const totalDelay = dots.length*55 + 480;
    setTimeout(() => finishPlayerAttack(dmg), totalDelay);
  }

  function finishPlayerAttack(dmg){
    monsterHp = Math.max(0, monsterHp - dmg);
    updateMonsterHpUI();
    monsterSpriteEl.classList.remove('hit'); void monsterSpriteEl.offsetWidth;
    monsterSpriteEl.classList.add('hit');
    const stageRect = stageEl.getBoundingClientRect();
    const monsterRect = monsterSpriteEl.getBoundingClientRect();
    showStagePop(`-${dmg}`, pointRelative(monsterRect, stageRect), 'dmg-mon');

    setTimeout(() => {
      if(monsterHp <= 0){ handleVictory(); return; }
      enemyAttack();
    }, 600);
  }

  function enemyAttack(){
    monsterSpriteEl.classList.remove('attack'); void monsterSpriteEl.offsetWidth;
    monsterSpriteEl.classList.add('attack');
    setTimeout(() => {
      const dmg = randInt(currentEncounter.atkMin, currentEncounter.atkMax);
      playerHp = Math.max(0, playerHp - dmg);
      updatePlayerHpUI();
      boardWrapEl.classList.remove('shake'); void boardWrapEl.offsetWidth;
      boardWrapEl.classList.add('shake');
      showFloatPop(`-${dmg}`, COLS*CELL/2, ROWS*CELL/2, 'dmg-ply');

      if(playerHp <= 0){
        setTimeout(handleDefeat, 500);
      } else {
        setTimeout(startNewTurn, 500);
      }
    }, 300);
  }

  function handleVictory(){
    battleEnded = true;
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    modalTitle.className = 'modal-title win';
    modalTitle.textContent = 'Victory!';
    modalMsg.textContent = `${currentEncounter.name} is defeated. You still have ${playerHp}/${PLAYER_MAX_HP} HP.`;
    nextBtn.style.display = (currentEncounterIndex < ENCOUNTERS.length-1) ? 'block' : 'none';
    endModal.style.display = 'flex';
  }

  function handleDefeat(){
    battleEnded = true;
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    modalTitle.className = 'modal-title lose';
    modalTitle.textContent = 'Defeated';
    modalMsg.textContent = `${currentEncounter.name} was too strong this time. Give it another shot.`;
    nextBtn.style.display = 'none';
    endModal.style.display = 'flex';
  }

  boardEl.addEventListener('contextmenu', e => e.preventDefault());
  boardEl.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  backBtn.addEventListener('click', backToMenu);
  menuBtn2.addEventListener('click', backToMenu);
  restartBtn.addEventListener('click', () => { if(!isResolving) startEncounter(); });
  retryBtn.addEventListener('click', () => startEncounter());
  nextBtn.addEventListener('click', () => openEncounter(currentEncounterIndex+1));

  buildCollectedChips();
  buildLevelList();
})();
</script>
</body>
</html>
